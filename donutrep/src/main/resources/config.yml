# same categories at the same GUI slots, same items at the same slots with the same
# display names, lore, and prices - no dynamic pricing. CRATE-KEYS items grant real
# keys through the Crates subsystem below; SHARD-menu spawner items are a disclosed
# placeholder until a real /spawner system is built. Selling is a separate system -
# see /sell and the SELL section below, which uses real worth.yml prices instead.
