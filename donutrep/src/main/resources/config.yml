# ═══════════════════════════════════════════════════════════════════════════════
# ECOWATCH - posts a Discord alert whenever any player's Money balance jumps by at
# least balance-jump-threshold between checks, so staff can spot duped/exploited
# money quickly.
# ═══════════════════════════════════════════════════════════════════════════════
ecowatch:
  discord:
    webhook-url: ""
    username: "EconomyWatchdog"
  balance-jump-threshold: 10000.0
  check-interval-seconds: 60

# ═══════════════════════════════════════════════════════════════════════════════
# MARKETWATCH - /marketwatch reports total circulating Money via a Discord webhook
# on request; /ahstats shows real Auction House activity (the highest-priced active
# listings).
# ═══════════════════════════════════════════════════════════════════════════════
marketwatch:
  discord:
    webhook-url: ""
    username: "MarketWatch"

# ═══════════════════════════════════════════════════════════════════════════════
# PURCHASEALERT - polls the same store backend StoreBridge delivers from and posts
# a Discord alert for each new purchase. backend_url and plugin_key MUST match the
# values in StoreBridge's own config.yml exactly, or polling stays paused.
# ═══════════════════════════════════════════════════════════════════════════════
purchasealert:
  backend_url: ""
  plugin_key: ""
  poll_interval_seconds: 15
  order_limit: 10
  discord:
    webhook-url: ""
    username: "Store Purchases"
