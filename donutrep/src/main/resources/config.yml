# DonutREP - every subsystem's settings live in its own top-level section below.

# ═══════════════════════════════════════════════════════════════════════════════
# ECONOMY - DonutREP's own internal Money balance manager. It registers itself
# directly with Vault as the server's economy provider - no other economy plugin
# needed, but Vault itself must still be installed. Shards (the premium currency)
# share this same subsystem's database but have no separate config - they're just
# granted via /addshards, crate rewards, or the Shard-priced /shop items.
# ═══════════════════════════════════════════════════════════════════════════════
economy:
  # New players start with this Money balance the first time they join.
  starting-balance: 1000.0

# ═══════════════════════════════════════════════════════════════════════════════
# MARKET - the /shop catalog, rebuilt to match real UltimateDonutSmp's shop.yml:
# fixed categories (END/NETHER/GEAR/FOOD/SHARD/CRATE-KEYS) at fixed GUI slots, each
# with a fixed list of items at fixed slots and a static price - no dynamic pricing,
# no player-to-player selling (that was part of the removed Auction House/instant-
# sell systems). CRATE-KEYS items grant real keys through the Crates subsystem
# below; SHARD-menu spawner items are a disclosed placeholder until a real
# /spawner system is built.
# ═══════════════════════════════════════════════════════════════════════════════
market:
  gui:
    title: "&8shop"
  max-quantity-per-transaction: 64
  categories:
    end:
      display-name: "&aend"
      material: END_STONE
      slot: 11
