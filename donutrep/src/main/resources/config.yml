# ═══════════════════════════════════════════════════════════════════════════════
# SELL - /sell, /sellhand, /sellall, /sellmulti, /sellmultiplier, /sellprogress,
# /sellhistory, /topsell, /worth. Entirely separate from /shop's buy catalog above,
# matching real UDS: prices come from the bundled worth.yml (flattened from the real
# UDS worth.yml you provided), not shop.yml.
# ═══════════════════════════════════════════════════════════════════════════════
sell:
  # Global multiplier applied on top of every worth.yml base price. View/change with /sellmultiplier.
  multiplier: 1.0

# ═══════════════════════════════════════════════════════════════════════════════
# AUCTION HOUSE - the real player-to-player marketplace (/auctionhouse, alias /ah;
# /shopedit for staff moderation).
# ═══════════════════════════════════════════════════════════════════════════════
auctionhouse:
  # Hard cap on how many listings one player can have active at once.
  max-listings-per-player: 10

# ═══════════════════════════════════════════════════════════════════════════════
# SOCIAL - private messages and ignore lists persist to social.db. Global chat mute/
# slow-mode delay (see /chat) are runtime-only staff toggles, not config values.
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# HOMES - per-player named homes and the single server-wide spawn point.
# ═══════════════════════════════════════════════════════════════════════════════
homes:
  max-homes-per-player: 3

# ═══════════════════════════════════════════════════════════════════════════════
# AFK - manual (/afk) and automatic idle-timeout AFK status.
# ═══════════════════════════════════════════════════════════════════════════════
afk:
  # How long (seconds) a player can be idle before being automatically marked AFK.
  # Set to 0 to disable automatic AFK (manual /afk still works).
  timeout-seconds: 300

  # Optional AFK lounge - going AFK teleports the player here, returning teleports them back.
  # Disabled by default. Set with /setafk zone (run at the location you want to use).
  zone:
    enabled: false
    world: ""
    x: 0.0
    y: 64.0
    z: 0.0

  # Optional auto-kick after being AFK too long. Disabled by default - /afk only tags a player
  # unless this is turned on.
  kick:
    enabled: false
    after-seconds: 1800

# ═══════════════════════════════════════════════════════════════════════════════
# TRAVEL - random teleport (/rtp, /rtpq).
# ═══════════════════════════════════════════════════════════════════════════════
travel:
  rtp:
    # Random-teleport lands somewhere between these two distances (blocks) from 0,0.
    min-radius: 200.0
    max-radius: 5000.0
    # Minimum time between a player's own /rtp uses.
    cooldown-seconds: 30
    # How many random X/Z picks to try before giving up and reporting failure.
    max-attempts: 20
    # How many /rtp safe-location searches can run at once before new /rtp requests are
    # told to use /rtpq instead.
    max-concurrent-searches: 3
    # How often (seconds) the /rtpq queue processes its next waiting player.
    queue-interval-seconds: 5

# ═══════════════════════════════════════════════════════════════════════════════
# TPA - player-to-player teleport requests (/tpa, /tpahere, /tpaccept, /tpadeny,
# /tpacancel, /tpauto, /tpahereauto).
# ═══════════════════════════════════════════════════════════════════════════════
tpa:
  # How long (seconds) a /tpa or /tpahere request stays open before it silently expires.
  request-timeout-seconds: 60

# ═══════════════════════════════════════════════════════════════════════════════
# PVP - dueling (/duel, /queue, /leave).
# ═══════════════════════════════════════════════════════════════════════════════
pvp:
  duel:
    # How long (seconds) a /duel challenge stays open before it silently expires.
    challenge-timeout-seconds: 30

# ═══════════════════════════════════════════════════════════════════════════════
# CRATES - bind a chest/barrel/ender chest/shulker box to a crate with /crate bind,
# then give players keys (or have StoreBridge run "crate set {player} <crate> <amount>"
# to deliver keys from a store purchase, or sell them Shards for keys via /shop's
# Crate Keys category). Crate ids match real UDS: amethyst/void/stellar/supernova.
# ═══════════════════════════════════════════════════════════════════════════════
crates:
  amethyst:
    display-name: "&d&lAmethyst Crate"
    key-material: TRIPWIRE_HOOK
    key-custom-model-data: 90000
    rewards:
      money_small:
        kind: MONEY
        money-amount: 250.0
        weight: 45
        display-name: "&a$250"
      money_big:
        kind: MONEY
        money-amount: 1000.0
        weight: 15
        display-name: "&a$1,000"
      shards_small:
        kind: SHARDS
        shards-amount: 15
        weight: 25
        display-name: "&d15 Shards"
      iron:
        kind: ITEM
        material: IRON_INGOT
        item-amount-min: 4
        item-amount-max: 8
        weight: 20
        display-name: "&fIron Ingots"
      diamonds:
        kind: ITEM
        material: DIAMOND
        item-amount-min: 1
