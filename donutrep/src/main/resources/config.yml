# DonutREP - every subsystem's settings live in its own top-level section below.

# ═══════════════════════════════════════════════════════════════════════════════
# ECONOMY - DonutREP's own internal Money balance manager. It registers itself
# directly with Vault as the server's economy provider - no other economy plugin
# needed, but Vault itself must still be installed. Shards (the premium currency)
# share this same subsystem's database but have no separate config - they're just
# granted via /addshards, /shopadmin addshards, or crate rewards.
# ═══════════════════════════════════════════════════════════════════════════════
economy:
  # New players start with this Money balance the first time they join.
  starting-balance: 1000.0

# ═══════════════════════════════════════════════════════════════════════════════
# MARKET - the dual-currency (Money/Shards) categorized shop. Money is the primary
# currency; Shards are a premium/milestone currency spent on cosmetic/black-market
# goods in the Shard Boutique below. The main vanilla item catalog (every obtainable
# block/item, sorted into Overworld/Nether/End and their sub-categories) is generated
# automatically from the server's Material list at startup using the rarity tiers
# below - it is not hand-typed here, since that would be thousands of near-duplicate
# lines.
# ═══════════════════════════════════════════════════════════════════════════════
market:
  gui:
    title: "&8Server Market"

  # Every generated catalog item's BASE buy price is base-money-value-per-rarity-tier times
  # this category's multiplier - "base" because real-time supply/demand pricing (see
  # dynamic-pricing below) then moves it up or down from there as people actually trade.
  category-multipliers:
    wood-and-forestry: 1.0
    agriculture-and-crops: 1.0
    ores-and-stone: 1.0
    mob-drops: 1.2
    nether: 1.8
    end: 3.0

  # Fraction of (current, dynamic) buy price a player gets back selling to the market.
  sell-back-fraction: 0.4

  # Minimum seconds between transactions per player, per item (script/macro sanity check).
  transaction-cooldown-seconds: 1

  # Hard cap on quantity per single buy/sell transaction.
  max-quantity-per-transaction: 6400

  # Prices are dynamic, not static - every material has its own live price factor (starting
  # at 1.0x its base price) that this drives up when players buy it and down when they sell
  # it. Persisted per-material to market-prices.yml so it survives restarts.
  dynamic-pricing:
    tick-interval-seconds: 60
    buy-impact-percent: 0.05
    sell-impact-percent: 0.05
    decay-percent-per-tick: 2.0
    min-price-factor: 0.25
    max-price-factor: 4.0

  # Shard Boutique - cosmetic and black-market vanilla items, priced in Shards, not Money.
  shard-boutique:
    black_market_totem:
      display-name: "&5&lBlack-Market Totem of Undying"
      description: "Rare - sold only for Shards, never for Money."
      material: TOTEM_OF_UNDYING
      price-shards: 500
    black_market_elytra:
      display-name: "&d&lBlack-Market Elytra"
      description: "Rare - sold only for Shards, never for Money."
      material: ELYTRA
      price-shards: 750

# ═══════════════════════════════════════════════════════════════════════════════
# AUCTION HOUSE - the real player-to-player marketplace (/orders to sell/browse/buy,
# /shopedit for staff moderation).
# ═══════════════════════════════════════════════════════════════════════════════
auctionhouse:
  # Hard cap on how many listings one player can have active at once.
  max-listings-per-player: 10

# ═══════════════════════════════════════════════════════════════════════════════
# SOCIAL - private messages and ignore lists persist to social.db. Global chat mute/
# slow-mode delay (see /chat) are runtime-only staff toggles, not config values.
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# HOMES - per-player named homes and the single server-wide spawn point.
# ═══════════════════════════════════════════════════════════════════════════════
homes:
  max-homes-per-player: 3

# ═══════════════════════════════════════════════════════════════════════════════
# AFK - manual (/afk) and automatic idle-timeout AFK status.
# ═══════════════════════════════════════════════════════════════════════════════
afk:
  # How long (seconds) a player can be idle before being automatically marked AFK.
  # Set to 0 to disable automatic AFK (manual /afk still works).
  timeout-seconds: 300

  # Optional AFK lounge - going AFK teleports the player here, returning teleports them back.
  # Disabled by default. Set with /setafk zone (run at the location you want to use).
  zone:
    enabled: false
    world: ""
    x: 0.0
    y: 64.0
    z: 0.0

  # Optional auto-kick after being AFK too long. Disabled by default - /afk only tags a player
  # unless this is turned on.
  kick:
    enabled: false
    after-seconds: 1800

# ═══════════════════════════════════════════════════════════════════════════════
# TRAVEL - random teleport (/rtp, /rtpq).
# ═══════════════════════════════════════════════════════════════════════════════
travel:
  rtp:
    # Random-teleport lands somewhere between these two distances (blocks) from 0,0.
    min-radius: 200.0
    max-radius: 5000.0
    # Minimum time between a player's own /rtp uses.
    cooldown-seconds: 30
    # How many random X/Z picks to try before giving up and reporting failure.
    max-attempts: 20
    # How many /rtp safe-location searches can run at once before new /rtp requests are
    # told to use /rtpq instead.
    max-concurrent-searches: 3
    # How often (seconds) the /rtpq queue processes its next waiting player.
    queue-interval-seconds: 5

# ═══════════════════════════════════════════════════════════════════════════════
# TPA - player-to-player teleport requests (/tpa, /tpahere, /tpaccept, /tpadeny,
# /tpacancel, /tpauto, /tpahereauto).
# ═══════════════════════════════════════════════════════════════════════════════
tpa:
  # How long (seconds) a /tpa or /tpahere request stays open before it silently expires.
  request-timeout-seconds: 60

# ═══════════════════════════════════════════════════════════════════════════════
# PVP - dueling (/duel, /queue, /leave).
# ═══════════════════════════════════════════════════════════════════════════════
pvp:
  duel:
    # How long (seconds) a /duel challenge stays open before it silently expires.
    challenge-timeout-seconds: 30

