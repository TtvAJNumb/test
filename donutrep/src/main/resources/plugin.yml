name: DonutREP
version: ${project.version}
main: com.donututils.donutrep.DonutREPPlugin
api-version: "1.21"
folia-supported: false
description: An original SMP economy/society plugin - a native Vault Money economy, a /shop catalog matching real UltimateDonutSmp's categories/items/prices, plus Teams, Crates, staff tools, and Discord watchdog/alert addons folded in. Registers itself as the server's Vault economy provider - no other economy plugin required. Vault itself must still be installed.
authors: [donututils]
depend:
  - Vault
commands:
  # --- Economy (Money + Shards) ---
  pay:
    description: Send Money to another online player.
    usage: /pay <player> <amount>
    permission: economy.command.pay
    permission-message: "&cYou do not have permission to use /pay."
  addshards:
    description: Grant Shards to a player (console command StoreBridge runs to deliver a package).
    usage: /addshards <player> <amount>
    permission: economy.admin
    permission-message: "&cYou do not have permission to use /addshards."
  removeshards:
    description: Remove Shards from a player (console command StoreBridge runs on a chargeback).
    usage: /removeshards <player> <amount>
    permission: economy.admin
    permission-message: "&cYou do not have permission to use /removeshards."
  shards:
    description: Check your Shards balance, or another player's.
    usage: /shards [player]
    permission: market.command.shards
    permission-message: "&cYou do not have permission to use /shards."
  # --- Market (/shop, matches real UDS shop.yml) ---
  shop:
    description: Open the shop (End/Nether/Gear/Food/Shard/Crate Keys), matching real UltimateDonutSmp.
    usage: /shop
    permission: market.command.shop
    permission-message: "&cYou do not have permission to use /shop."
  shopadmin:
    description: Administer the shop.
    usage: /shopadmin reload
    permission: market.admin
    permission-message: "&cYou do not have permission to manage the shop."
  # --- Teams ---
  team:
    description: Create, disband, or manage a team.
    usage: /team <create <name>|disband|add <player>|remove <player>|leave|info [player]|list>
    permission: teams.command.team
    permission-message: "&cYou do not have permission to use /team."
  teambaltop:
    description: Ranks teams by combined member Money.
    usage: /teambaltop
    permission: teams.command.leaderboard
    permission-message: "&cYou do not have permission to use /teambaltop."
  teamshardstop:
    description: Ranks teams by combined member Shards.
    usage: /teamshardstop
    permission: teams.command.leaderboard
    permission-message: "&cYou do not have permission to use /teamshardstop."
  # --- Crates ---
  crate:
    description: Bind/unbind a crate block, give crate keys, or manage crates.
    usage: /crate <bind <id>|unbind|set <player> <crate> <amount>|give|list|reload>
    permission: crates.admin
    permission-message: "&cYou do not have permission to use /crate."
  # --- Staff ---
  sus:
    description: Staff panel - browse online players, freeze/unfreeze, view inventory/ender chest.
    usage: /sus [player|reload]
    permission: staff.command.sus
    permission-message: "&cYou do not have permission to use /sus."
  # --- EconomyWatchdog ---
  ecowatch:
    description: Manage EconomyWatchdog's Discord balance-jump alerts.
    usage: /ecowatch <reload|test|status>
    permission: economywatchdog.admin
    permission-message: "&cYou do not have permission to use /ecowatch."
  # --- MarketWatch ---
  marketwatch:
    description: Check total circulating Money and MarketWatch's webhook status.
    usage: /marketwatch <reload|status>
    permission: marketwatch.admin
    permission-message: "&cYou do not have permission to use /marketwatch."
  # --- PunishmentHistoryGUI ---
  punishhistory:
    description: View a player's staff notes.
    usage: /punishhistory [player]
    permission: punishmenthistorygui.notes.view
    permission-message: "&cYou do not have permission to use /punishhistory."
  note:
    description: Manage staff notes on a player.
    usage: /note <add|remove|list> <player> [text|index]
    permission: punishmenthistorygui.notes.view
    permission-message: "&cYou do not have permission to use /note."
  # --- PurchaseAlert ---
  purchasealert:
    description: Manage Discord alerts for new store purchases (reads StoreBridge's backend).
    usage: /purchasealert <reload|test|status>
    permission: purchasealert.admin
    permission-message: "&cYou do not have permission to use /purchasealert."
  # --- Help ---
  help:
    description: List admin help topics, view one, or (for players) show a quickstart guide.
    usage: /help [topic]
permissions:
  economy.command.pay:
    description: Allows sending Money to another player
    default: true
  economy.admin:
    description: Allows administering the economy and granting/removing Shards
    default: op
  market.command.shop:
    description: Allows using the shop
    default: true
  market.command.shards:
    description: Allows checking Shards balances
    default: true
  market.admin:
    description: Allows administering the shop
    default: op
  teams.command.team:
    description: Allows creating and managing a team
    default: true
  teams.command.leaderboard:
    description: Allows viewing the team leaderboards
    default: true
  crates.admin:
    description: Allows binding/unbinding crates and giving crate keys
    default: op
  staff.command.sus:
    description: Allows opening the staff panel
    default: op
  staff.freeze:
    description: Allows freezing/unfreezing a player from the staff panel
    default: op
  staff.freezeexempt:
    description: Exempts a player from being frozen
    default: op
  staff.invsee:
    description: Allows viewing a player's inventory from the staff panel
    default: op
  staff.endersee:
    description: Allows viewing a player's ender chest from the staff panel
    default: op
  economywatchdog.admin:
    description: Allows managing EconomyWatchdog's Discord balance-jump alerts
    default: op
  marketwatch.admin:
    description: Allows managing MarketWatch's Discord webhook
    default: op
  punishmenthistorygui.notes.view:
    description: Allows viewing a player's staff notes
    default: op
  punishmenthistorygui.notes.add:
    description: Allows adding a staff note to a player
    default: op
  punishmenthistorygui.notes.remove:
    description: Allows removing a staff note from a player
    default: op
  purchasealert.admin:
    description: Allows managing PurchaseAlert's Discord webhook
    default: op
  donutrep.help.admin:
    description: Shows the full admin /help topic list instead of the player quickstart
    default: op
