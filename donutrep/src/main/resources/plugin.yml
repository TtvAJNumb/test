name: DonutREP
version: ${project.version}
main: com.donututils.donutrep.DonutREPPlugin
api-version: "1.21"
folia-supported: false
description: An original SMP economy/society plugin - a native Vault Money economy, a /shop catalog matching real UltimateDonutSmp's shop.yml, a real /sell family priced from real UDS worth.yml, a real player-to-player auction house, social (chat/msg/ignore), homes/warps, AFK, random-teleport, and dueling - plus Teams, Crates, staff tools, and Discord watchdog/alert addons folded in. Registers itself as the server's Vault economy provider - no other economy plugin required. Vault itself must still be installed.
authors: [donututils]
depend:
  - Vault
commands:
  # --- Economy (Money + Shards) ---
  pay:
    description: Send Money to another online player.
    usage: /pay <player> <amount>
    permission: economy.command.pay
    permission-message: "&cYou do not have permission to use /pay."
  addshards:
    description: Grant Shards to a player (console command StoreBridge runs to deliver a package).
    usage: /addshards <player> <amount>
    permission: economy.admin
    permission-message: "&cYou do not have permission to use /addshards."
  removeshards:
    description: Remove Shards from a player (console command StoreBridge runs on a chargeback).
    usage: /removeshards <player> <amount>
    permission: economy.admin
    permission-message: "&cYou do not have permission to use /removeshards."
  shards:
    description: Check your Shards balance, or another player's.
    usage: /shards [player]
    permission: market.command.shards
    permission-message: "&cYou do not have permission to use /shards."
  balance:
    description: Check your Money balance, or another player's.
    usage: /balance [player]
    aliases: [bal, money]
    permission: economy.command.balance
    permission-message: "&cYou do not have permission to use /balance."
  addmoney:
    description: Add Money to a player.
    usage: /addmoney <player> <amount>
    permission: economy.admin
    permission-message: "&cYou do not have permission to use /addmoney."
  removemoney:
    description: Remove Money from a player.
    usage: /removemoney <player> <amount>
    permission: economy.admin
    permission-message: "&cYou do not have permission to use /removemoney."
  setmoney:
    description: Set a player's Money balance exactly.
    usage: /setmoney <player> <amount>
    permission: economy.admin
    permission-message: "&cYou do not have permission to use /setmoney."
  shardpay:
    description: Send Shards to another online player.
    usage: /shardpay <player> <amount>
    permission: economy.command.pay
    permission-message: "&cYou do not have permission to use /shardpay."
  setshards:
    description: Set a player's Shards balance exactly.
    usage: /setshards <player> <amount>
    permission: economy.admin
    permission-message: "&cYou do not have permission to use /setshards."
  # --- Market (/shop, matches real UDS shop.yml) ---
  shop:
    description: Open the shop (End/Nether/Gear/Food/Shard/Crate Keys), matching real UltimateDonutSmp.
    usage: /shop
    permission: market.command.shop
    permission-message: "&cYou do not have permission to use /shop."
  shopadmin:
    description: Administer the shop.
    usage: /shopadmin reload
    permission: market.admin
    permission-message: "&cYou do not have permission to manage the shop."
  # --- Sell (priced from real UDS worth.yml - separate from /shop's buy catalog) ---
  worth:
    description: Check the sell price of an item.
    usage: /worth [material]
    permission: sell.command.sell
    permission-message: "&cYou do not have permission to use /worth."
  sell:
    description: Sell the item in your hand.
    usage: /sell
    permission: sell.command.sell
    permission-message: "&cYou do not have permission to use /sell."
  sellhand:
    description: Sell the item in your hand.
    usage: /sellhand
    permission: sell.command.sell
    permission-message: "&cYou do not have permission to use /sellhand."
  sellall:
    description: Sell every sellable item in your inventory.
    usage: /sellall
    permission: sell.command.sell
    permission-message: "&cYou do not have permission to use /sellall."
  sellmulti:
    description: Sell a specific amount of a specific material from your inventory.
    usage: /sellmulti <material> <amount>
    permission: sell.command.sell
    permission-message: "&cYou do not have permission to use /sellmulti."
  sellmultiplier:
    description: View, or (admin) set, the global sell-price multiplier.
    usage: /sellmultiplier [value]
    permission: sell.command.sell
    permission-message: "&cYou do not have permission to use /sellmultiplier."
  sellprogress:
    description: View lifetime selling stats - items sold and Money earned.
    usage: /sellprogress [player]
    permission: sell.command.sell
    permission-message: "&cYou do not have permission to use /sellprogress."
  sellhistory:
    description: View your most recent sell transactions.
    usage: /sellhistory
    permission: sell.command.sell
    permission-message: "&cYou do not have permission to use /sellhistory."
  topsell:
    description: View the top sellers leaderboard.
    usage: /topsell
    permission: sell.command.sell
    permission-message: "&cYou do not have permission to use /topsell."
  # --- Auction House (real player-to-player sell marketplace) ---
  auctionhouse:
    description: List, browse, and buy player-listed items on the Auction House.
    usage: /auctionhouse <sell <price>|list [page]|buy <id>|my|claims|cancel <id>|reload>
    aliases: [ah]
    permission: auctionhouse.command.auctionhouse
    permission-message: "&cYou do not have permission to use /auctionhouse."
  shopedit:
    description: Staff moderation for the Auction House - force-remove a listing.
    usage: /shopedit remove <id>
    permission: auctionhouse.admin
    permission-message: "&cYou do not have permission to use /shopedit."
  # --- Orders board (buy requests other players can fulfill) ---
  orders:
    description: Post buy requests other players can fulfill, or fulfill/collect/cancel one.
    usage: /orders [create <price> <amount>|fulfill <id>|my|collect|cancel <id>|reload]
    permission: orders.command.orders
    permission-message: "&cYou do not have permission to use /orders."
  # --- Social ---
  chat:
    description: Staff administration of global chat - mute/unmute/delay/clear.
    usage: /chat <help|mute|unmute|delay <seconds>|clear>
    permission: social.command.chat
    permission-message: "&cYou do not have permission to use /chat."
  msg:
    description: Send a private message to another online player.
    usage: /msg <player> <message>
    permission: social.command.msg
    permission-message: "&cYou do not have permission to use /msg."
  pm:
    description: Alias for /msg - send a private message to another online player.
    usage: /pm <player> <message>
    permission: social.command.msg
    permission-message: "&cYou do not have permission to use /pm."
  reply:
    description: Reply to the last player who messaged you (or you messaged).
    usage: /reply <message>
    permission: social.command.msg
    permission-message: "&cYou do not have permission to use /reply."
  ignore:
    description: Stop receiving private messages and chat lines from a player.
    usage: /ignore <player>
    permission: social.command.ignore
    permission-message: "&cYou do not have permission to use /ignore."
  unignore:
    description: Undo a previous /ignore.
    usage: /unignore <player>
    permission: social.command.ignore
    permission-message: "&cYou do not have permission to use /unignore."
  # --- Homes / Warps ---
  home:
    description: Teleport to one of your named homes.
    usage: /home [name]
    permission: homes.command.home
    permission-message: "&cYou do not have permission to use /home."
  homes:
    description: List every home you've set.
    usage: /homes
    permission: homes.command.home
    permission-message: "&cYou do not have permission to use /homes."
  sethome:
    description: Set (or update) a named home at your current location.
    usage: /sethome [name]
    permission: homes.command.home
    permission-message: "&cYou do not have permission to use /sethome."
  delhome:
    description: Delete a named home.
    usage: /delhome <name>
    permission: homes.command.home
    permission-message: "&cYou do not have permission to use /delhome."
  renamehome:
    description: Rename one of your homes.
    usage: /renamehome <old> <new>
    permission: homes.command.home
    permission-message: "&cYou do not have permission to use /renamehome."
  spawn:
    description: Teleport to the server's spawn point.
    usage: /spawn
    permission: homes.command.spawn
    permission-message: "&cYou do not have permission to use /spawn."
  setspawn:
    description: Set the server's spawn point to your current location.
    usage: /setspawn
    permission: homes.admin
    permission-message: "&cYou do not have permission to use /setspawn."
  # --- AFK ---
  afk:
    description: Toggle your own AFK status.
    usage: /afk
    permission: afk.command.afk
    permission-message: "&cYou do not have permission to use /afk."
  setafk:
    description: Force another player's AFK status on or off.
    usage: /setafk <player> [on|off]
    permission: afk.admin
    permission-message: "&cYou do not have permission to use /setafk."
  # --- Travel ---
  rtp:
    description: Teleport to a random nearby location.
    usage: /rtp
    permission: travel.command.rtp
    permission-message: "&cYou do not have permission to use /rtp."
  rtpq:
    description: Join the random-teleport queue instead of searching immediately.
    usage: /rtpq
    permission: travel.command.rtp
    permission-message: "&cYou do not have permission to use /rtpq."
  teleport:
    description: Teleport a player to a target (or to you).
    usage: /teleport <player> [target]
    permission: travel.admin
    permission-message: "&cYou do not have permission to use /teleport."
  randomteleport:
    description: Force another player through a random teleport.
    usage: /randomteleport <player>
    permission: travel.admin
    permission-message: "&cYou do not have permission to use /randomteleport."
  findplayer:
    description: Show a player's current world and coordinates.
    usage: /findplayer <player>
    permission: travel.admin
    permission-message: "&cYou do not have permission to use /findplayer."
  # --- Warps / Portals ---
  warp:
    description: Teleport to a named warp, or list every warp.
    usage: /warp [name]
    permission: warps.command.warp
    permission-message: "&cYou do not have permission to use /warp."
  setwarp:
    description: Create or update a warp at your current location.
    usage: /setwarp <name>
    permission: warps.admin
    permission-message: "&cYou do not have permission to use /setwarp."
  delwarp:
    description: Delete a warp.
    usage: /delwarp <name>
    permission: warps.admin
    permission-message: "&cYou do not have permission to use /delwarp."
  warpmanager:
    description: Admin overview of every warp, with coordinates.
    usage: /warpmanager [delete <name>]
    permission: warps.admin
    permission-message: "&cYou do not have permission to use /warpmanager."
  portalmanager:
    description: Define physical portal regions that teleport players to a warp on contact.
    usage: /portalmanager <pos1|pos2|create <warp>|delete <id>|list>
    permission: warps.admin
    permission-message: "&cYou do not have permission to use /portalmanager."
  # --- TPA ---
  tpa:
    description: Request to teleport to another player.
    usage: /tpa <player>
    permission: tpa.command.tpa
    permission-message: "&cYou do not have permission to use /tpa."
  tpahere:
    description: Request that another player teleport to you.
    usage: /tpahere <player>
    permission: tpa.command.tpa
    permission-message: "&cYou do not have permission to use /tpahere."
  tpaccept:
    description: Accept a pending teleport request.
    usage: /tpaccept [player]
    permission: tpa.command.tpa
    permission-message: "&cYou do not have permission to use /tpaccept."
  tpadeny:
    description: Deny a pending teleport request.
    usage: /tpadeny [player]
    permission: tpa.command.tpa
    permission-message: "&cYou do not have permission to use /tpadeny."
  tpacancel:
    description: Cancel every teleport request you've sent.
    usage: /tpacancel
    permission: tpa.command.tpa
    permission-message: "&cYou do not have permission to use /tpacancel."
  tpauto:
    description: Toggle auto-accepting incoming /tpa requests.
    usage: /tpauto
    permission: tpa.command.tpa
    permission-message: "&cYou do not have permission to use /tpauto."
  tpahereauto:
    description: Toggle auto-accepting incoming /tpahere requests.
    usage: /tpahereauto
    permission: tpa.command.tpa
    permission-message: "&cYou do not have permission to use /tpahereauto."
  # --- PvP ---
  duel:
    description: Challenge a player to a 1v1 duel, or accept/decline a pending challenge.
    usage: /duel <player|accept|decline>
    permission: pvp.command.duel
    permission-message: "&cYou do not have permission to use /duel."
  queue:
    description: Join the random-opponent duel matchmaking queue.
    usage: /queue
    permission: pvp.command.duel
    permission-message: "&cYou do not have permission to use /queue."
  leave:
    description: Forfeit your active duel, or leave the matchmaking queue.
    usage: /leave
    permission: pvp.command.duel
    permission-message: "&cYou do not have permission to use /leave."
  # --- Teams ---
  team:
    description: Create, disband, or manage a team.
    usage: /team <create <name>|disband|add <player>|remove <player>|leave|info [player]|list>
    permission: teams.command.team
    permission-message: "&cYou do not have permission to use /team."
  teambaltop:
    description: Ranks teams by combined member Money.
    usage: /teambaltop
    permission: teams.command.leaderboard
    permission-message: "&cYou do not have permission to use /teambaltop."
  teamshardstop:
    description: Ranks teams by combined member Shards.
    usage: /teamshardstop
    permission: teams.command.leaderboard
    permission-message: "&cYou do not have permission to use /teamshardstop."
  # --- Crates ---
  crate:
    description: Bind/unbind a crate block, give crate keys, or manage crates.
    usage: /crate <bind <id>|unbind|set <player> <crate> <amount>|give|list|reload>
    permission: crates.admin
    permission-message: "&cYou do not have permission to use /crate."
  # --- Staff ---
  sus:
    description: Staff panel - browse online players, freeze/unfreeze, view inventory/ender chest.
    usage: /sus [player|reload]
    permission: staff.command.sus
    permission-message: "&cYou do not have permission to use /sus."
  freeze:
    description: Lock a player in place - standalone version of the /sus panel's freeze button.
    usage: /freeze <player>
    permission: staff.freeze
    permission-message: "&cYou do not have permission to use /freeze."
  fly:
    description: Toggle flight for yourself, or (with permission) another player.
    usage: /fly [player]
    permission: staff.command.fly
    permission-message: "&cYou do not have permission to use /fly."
  flyspeed:
    description: Set flight speed (0-10) for yourself, or (with permission) another player.
    usage: /flyspeed <0-10> [player]
    permission: staff.command.fly
    permission-message: "&cYou do not have permission to use /flyspeed."
  heal:
    description: Fully restore health for yourself, or (with permission) another player.
    usage: /heal [player]
    permission: staff.command.heal
    permission-message: "&cYou do not have permission to use /heal."
  feed:
    description: Fully restore food level for yourself, or (with permission) another player.
    usage: /feed [player]
    permission: staff.command.feed
    permission-message: "&cYou do not have permission to use /feed."
  gamemode:
    description: Change your (or, with permission, another player's) game mode.
    usage: /gamemode <survival|creative|adventure|spectator> [player]
    aliases: [gmc, gms, gma, gmsp]
    permission: staff.command.gamemode
    permission-message: "&cYou do not have permission to use /gamemode."
  god:
    description: Toggle damage immunity for yourself, or (with permission) another player.
    usage: /god [player]
    aliases: [godmode]
    permission: staff.command.god
    permission-message: "&cYou do not have permission to use /god."
  vanish:
    description: Toggle invisibility to everyone without staff.vanish.see.
    usage: /vanish [player]
    permission: staff.command.vanish
    permission-message: "&cYou do not have permission to use /vanish."
  invsee:
    description: Open a live, editable view of a player's inventory.
    usage: /invsee <player>
    permission: staff.invsee
    permission-message: "&cYou do not have permission to use /invsee."
  staffmode:
    description: Stash your inventory and switch to creative + vanish + flight for investigating.
    usage: /staffmode
    permission: staff.command.staffmode
    permission-message: "&cYou do not have permission to use /staffmode."
  stafflist:
    description: List every online staff member and their vanish/staffmode status.
    usage: /stafflist
    permission: staff.command.sus
    permission-message: "&cYou do not have permission to use /stafflist."
  staffchat:
    description: Send one message to staff chat, or toggle always routing your chat there.
    usage: /staffchat [message]
    permission: staff.staffchat
    permission-message: "&cYou do not have permission to use /staffchat."
  helpop:
    description: Send a message to every online staff member.
    usage: /helpop <message>
    permission: staff.command.helpop
    permission-message: "&cYou do not have permission to use /helpop."
  report:
    description: Report a player to online staff.
    usage: /report <player> <reason>
    permission: staff.command.report
    permission-message: "&cYou do not have permission to use /report."
  rename:
    description: Rename the item in your hand.
    usage: /rename <name>
    permission: staff.command.rename
    permission-message: "&cYou do not have permission to use /rename."
  # --- EconomyWatchdog ---
  ecowatch:
    description: Manage EconomyWatchdog's Discord balance-jump alerts.
    usage: /ecowatch <reload|test|status>
    permission: economywatchdog.admin
    permission-message: "&cYou do not have permission to use /ecowatch."
  # --- MarketWatch ---
  marketwatch:
    description: Check total circulating Money and MarketWatch's webhook status.
    usage: /marketwatch <reload|status>
    permission: marketwatch.admin
    permission-message: "&cYou do not have permission to use /marketwatch."
  ahstats:
    description: Shows real Auction House activity - the highest-priced active listings.
    usage: /ahstats
    permission: marketwatch.command.ahstats
    permission-message: "&cYou do not have permission to use /ahstats."
  # --- PunishmentHistoryGUI ---
  punishhistory:
    description: View a player's staff notes.
    usage: /punishhistory [player]
    permission: punishmenthistorygui.notes.view
    permission-message: "&cYou do not have permission to use /punishhistory."
  note:
    description: Manage staff notes on a player.
    usage: /note <add|remove|list> <player> [text|index]
    permission: punishmenthistorygui.notes.view
    permission-message: "&cYou do not have permission to use /note."
  # --- PurchaseAlert ---
  purchasealert:
    description: Manage Discord alerts for new store purchases (reads StoreBridge's backend).
    usage: /purchasealert <reload|test|status>
    permission: purchasealert.admin
    permission-message: "&cYou do not have permission to use /purchasealert."
  # --- Help ---
  help:
    description: List admin help topics, view one, or (for players) show a quickstart guide.
    usage: /help [topic]
permissions:
  economy.command.pay:
    description: Allows sending Money to another player
    default: true
  economy.command.balance:
    description: Allows checking your own or another player's Money balance
    default: true
  economy.admin:
    description: Allows administering the economy and granting/removing Shards
    default: op
  market.command.shop:
    description: Allows using the shop
    default: true
  market.command.shards:
    description: Allows checking Shards balances
    default: true
  market.admin:
    description: Allows administering the shop
    default: op
  sell.command.sell:
    description: Allows selling items and viewing worth/sell stats
    default: true
  sell.admin:
    description: Allows setting the global sell-price multiplier
    default: op
  auctionhouse.command.auctionhouse:
    description: Allows listing, browsing, and buying on the Auction House
    default: true
  auctionhouse.admin:
    description: Allows force-removing any Auction House listing
    default: op
  orders.command.orders:
    description: Allows posting, fulfilling, and collecting on the Orders board
    default: true
  social.command.chat:
    description: Allows administering global chat (mute/unmute/delay/clear)
    default: op
  social.chat.bypass:
    description: Exempts a player from global chat mute/slow-mode
    default: op
  social.command.msg:
    description: Allows sending and replying to private messages
    default: true
  social.command.ignore:
    description: Allows ignoring/unignoring other players
    default: true
  homes.command.home:
    description: Allows setting and using named homes
    default: true
  homes.command.spawn:
    description: Allows teleporting to spawn
    default: true
  homes.admin:
    description: Allows setting the server's spawn point
    default: op
  afk.command.afk:
    description: Allows toggling your own AFK status
    default: true
  afk.admin:
    description: Allows forcing another player's AFK status
    default: op
  travel.command.rtp:
    description: Allows random-teleporting
    default: true
  travel.admin:
    description: Allows /teleport, /randomteleport, and /findplayer
    default: op
  warps.command.warp:
    description: Allows teleporting to warps
    default: true
  warps.admin:
    description: Allows creating, deleting, and managing warps and portals
    default: op
  tpa.command.tpa:
    description: Allows sending and answering teleport requests
    default: true
  pvp.command.duel:
    description: Allows dueling, queueing, and leaving
    default: true
  teams.command.team:
    description: Allows creating and managing a team
    default: true
  teams.command.leaderboard:
    description: Allows viewing the team leaderboards
    default: true
  crates.admin:
    description: Allows binding/unbinding crates and giving crate keys
    default: op
  staff.command.sus:
    description: Allows opening the staff panel
    default: op
  staff.freeze:
    description: Allows freezing/unfreezing a player from the staff panel
    default: op
  staff.freezeexempt:
    description: Exempts a player from being frozen
    default: op
  staff.invsee:
    description: Allows viewing a player's inventory from the staff panel or /invsee
    default: op
  staff.endersee:
    description: Allows viewing a player's ender chest from the staff panel
    default: op
  staff.command.fly:
    description: Allows toggling your own flight
    default: op
  staff.fly.others:
    description: Allows toggling another player's flight or fly speed
    default: op
  staff.command.heal:
    description: Allows healing yourself
    default: op
  staff.heal.others:
    description: Allows healing another player
    default: op
  staff.command.feed:
    description: Allows feeding yourself
    default: op
  staff.feed.others:
    description: Allows feeding another player
    default: op
  staff.command.gamemode:
    description: Allows changing your own game mode
    default: op
  staff.gamemode.others:
    description: Allows changing another player's game mode
    default: op
  staff.command.god:
    description: Allows toggling your own god mode
    default: op
  staff.god.others:
    description: Allows toggling another player's god mode
    default: op
  staff.command.vanish:
    description: Allows toggling your own vanish state
    default: op
  staff.vanish.others:
    description: Allows vanishing another player
    default: op
  staff.vanish.see:
    description: Allows seeing vanished players
    default: op
  staff.command.staffmode:
    description: Allows using /staffmode
    default: op
  staff.staffchat:
    description: Allows using and receiving staff chat
    default: op
  staff.command.helpop:
    description: Allows sending a /helpop message
    default: true
  staff.helpop.receive:
    description: Allows receiving /helpop messages
    default: op
  staff.command.report:
    description: Allows reporting a player
    default: true
  staff.report.receive:
    description: Allows receiving /report messages
    default: op
  staff.command.rename:
    description: Allows renaming the item in your hand
    default: true
  economywatchdog.admin:
    description: Allows managing EconomyWatchdog's Discord balance-jump alerts
    default: op
  marketwatch.admin:
    description: Allows managing MarketWatch's Discord webhook
    default: op
  marketwatch.command.ahstats:
    description: Allows checking Auction House stats via /ahstats
    default: true
  punishmenthistorygui.notes.view:
    description: Allows viewing a player's staff notes
    default: op
  punishmenthistorygui.notes.add:
    description: Allows adding a staff note to a player
    default: op
  punishmenthistorygui.notes.remove:
    description: Allows removing a staff note from a player
    default: op
  purchasealert.admin:
    description: Allows managing PurchaseAlert's Discord webhook
    default: op
  donutrep.help.admin:
    description: Shows the full admin /help topic list instead of the player quickstart
    default: op
