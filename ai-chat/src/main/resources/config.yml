# AIChat - a general-purpose AI chat assistant for your server. This plugin is standalone - it
# doesn't depend on Vault or any other plugin in this repo.
#
# Pick which AI provider to use. Options: "anthropic", "gemini", "ollama"
#
#   anthropic (PAID, no free tier) - Claude models. Best quality, and the only provider that
#     currently supports the StockMarket/MarketWatch data tools below. Get a key (billed by usage)
#     at https://console.anthropic.com/. Model examples:
#       claude-sonnet-5           - balanced, good default
#       claude-opus-5-5           - most capable, slower/costlier
#       claude-haiku-4-5-20251001 - fastest/cheapest
#       claude-fable-5-1          - alternative general-purpose model
#
#   gemini (FREE tier available) - Google's Gemini models. Get a free API key at
#     https://aistudio.google.com/apikey. Free tier has rate limits but no billing required. No
#     data-tool support yet - plain chat only. Google retires old model names periodically (if you
#     get a "model no longer available" error, it'll tell you the replacement) - as of this writing:
#       gemini-flash-latest - always points at the current fast/free-tier-friendly model, good default
#       gemini-3.0-flash    - fast, free-tier friendly
#       gemini-3.0-pro      - more capable, lower free-tier limits
#
#   ollama (FREE, self-hosted) - runs entirely on your own hardware, no API key, no internet
#     required, no usage limits. Needs Ollama (https://ollama.com) installed and running
#     (`ollama pull llama3.1` then `ollama serve`) either on the same machine as the server or one
#     you can reach over the network. No data-tool support yet - plain chat only. Model examples
#     (must be already pulled on the Ollama server): llama3.1, llama3.2, mistral, qwen2.5
provider: "anthropic"

# Required for anthropic and gemini. Not needed for ollama unless you've put your own auth in front
# of it (sent as a Bearer token if set).
api-key: ""

# Only used when provider is "ollama": the base URL of your Ollama server.
ollama-base-url: "http://localhost:11434"

# The model name for whichever provider you picked above - see the examples in the comments above.
model: "claude-sonnet-5"

# The assistant's name, shown as a chat prefix (e.g. "Astra: Hey there!").
assistant-name: "Astra"

# The assistant's personality/instructions. This is sent as the system prompt on every request, so
# you can fully customize how it talks and what it knows about your server here.
#
# If StockMarket and/or MarketWatch are also installed, this assistant can call a few read-only
# tools to answer real questions about them (current stock prices, recent auction house sale stats,
# and a permission-filtered list of server commands) instead of guessing. It only ever sees what
# those tools return - never player balances, punishment history, or any other private data.
system-prompt: "You are Astra, a friendly and helpful AI assistant for this Minecraft server. Keep replies concise and conversational, suitable for in-game chat. When asked about stock prices, the auction house, or server commands, use the tools available to you rather than guessing - if a tool has no data, say so honestly instead of making something up. Never claim to know a player's balance, inventory, or private information, since you have no access to that."

# Max tokens the model is allowed to generate per reply. Higher = longer replies but costs more per request.
max-tokens: 400

# How many back-and-forth exchanges (one player message + one assistant reply = one exchange) to
# remember per player before the oldest is dropped. This gives the assistant short-term memory of
# the conversation. Memory is in-memory only and resets when the server restarts.
memory-limit: 6

# Minimum seconds a player must wait between messages, to keep API usage/costs under control.
cooldown-seconds: 3

# Max characters allowed in a single player message.
max-message-length: 400
