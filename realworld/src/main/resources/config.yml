# ═══════════════════════════════════════════════════════════════════════════════
# AICHAT - in-game AI chat assistant, powered by Anthropic Claude/Gemini/Ollama.
# ═══════════════════════════════════════════════════════════════════════════════
aichat:
  # Options: "anthropic", "gemini", "ollama" - see the original ai-chat module's config.yml comments
  # (kept in git history) for the full provider writeup.
  provider: "anthropic"

  # Required for anthropic and gemini. Not needed for ollama unless you've put your own auth in front
  # of it (sent as a Bearer token if set).
  api-key: ""

  # Only used when provider is "ollama": the base URL of your Ollama server.
  ollama-base-url: "http://localhost:11434"

  # The model name for whichever provider you picked above.
  model: "claude-sonnet-5"

  # The assistant's name, shown as a chat prefix (e.g. "Astra: Hey there!").
  assistant-name: "Astra"

  # The assistant's personality/instructions, sent as the system prompt on every request. It can call
  # a few read-only tools to answer real questions about the stock market, the auction house, and
  # server commands - it only ever sees what those tools return, never player balances or private data.
  system-prompt: "You are Astra, a friendly and helpful AI assistant for this Minecraft server. Keep replies concise and conversational, suitable for in-game chat. When asked about stock prices, the auction house, or server commands, use the tools available to you rather than guessing - if a tool has no data, say so honestly instead of making something up. Never claim to know a player's balance, inventory, or private information, since you have no access to that."

  # Max tokens the model is allowed to generate per reply.
  max-tokens: 400

  # How many back-and-forth exchanges to remember per player before the oldest is dropped. In-memory
  # only, resets on restart.
  memory-limit: 6

  # Minimum seconds a player must wait between messages.
  cooldown-seconds: 3

  # Max characters allowed in a single player message.
  max-message-length: 400
