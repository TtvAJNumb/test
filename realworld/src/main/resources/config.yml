# ═══════════════════════════════════════════════════════════════════════════════
# CAREERS - on-join age tier + job selection, automated wages, and real task
# bonuses for jobs that map to vanilla actions.
# ═══════════════════════════════════════════════════════════════════════════════
careers:
  onboarding:
    # Shown the first time a player joins with no age tier chosen yet - opens the age-tier GUI.
    welcome-message: "&6&lWelcome! &7Pick an age tier, then a job, to start earning a wage."

  # School system: every player starts as a Minor (restricted to Tier 1 jobs). Once their tracked
  # playtime on this server reaches this many minutes, they automatically "graduate" to Adult -
  # no admin command needed - and are notified + get first pick of every Tier 2-4 job. Playtime
  # only counts while online (it's a session-tick counter, not calendar time).
  school:
    minor-to-adult-playtime-minutes: 600

  jobs:
    # ── Tier 1: entry-level, available to Minors ────────────────────────────────
    lumberjack:
      display-name: "&2Lumberjack"
      min-age-tier: MINOR
      wage-amount: 25.0
      wage-interval-minutes: 30
      block-bonuses:
        OAK_LOG: 1.0
        BIRCH_LOG: 1.0
        SPRUCE_LOG: 1.0
        JUNGLE_LOG: 1.0
        ACACIA_LOG: 1.0
        DARK_OAK_LOG: 1.0
        MANGROVE_LOG: 1.0
        CHERRY_LOG: 1.0

    farmer:
      display-name: "&eSugar Cane & Crop Farmer"
      min-age-tier: MINOR
      wage-amount: 25.0
      wage-interval-minutes: 30
      block-bonuses:
        WHEAT: 1.0
        CARROTS: 1.0
        POTATOES: 1.0
        BEETROOTS: 1.0
        SUGAR_CANE: 0.5

    fisherman:
      display-name: "&bFisherman"
      min-age-tier: MINOR
      wage-amount: 20.0
      wage-interval-minutes: 30
      fish-catch-bonus: 3.0

