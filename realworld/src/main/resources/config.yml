  legacy:
    inheritance-percent: 10.0
    shard-bonus-per-legacy: 50
    wage-bonus-percent-per-legacy: 2.0

# ═══════════════════════════════════════════════════════════════════════════════
# CRATES - bind a chest/barrel/ender chest/shulker box to a crate with /crate bind,
# then give players keys (or have StoreBridge run "crate set {player} <crate> <amount>"
# to deliver keys from a store purchase). Matches the crate ids StoreBridge's real
