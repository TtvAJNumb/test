name: RealWorld
version: ${project.version}
main: com.donututils.realworld.RealWorldPlugin
api-version: "1.21"
folia-supported: false
description: The full life-simulation economy in one plugin - banking/credit/loans/corporations (Ledger), a stock market, a dual-currency (Money/Shards) categorized item shop covering every obtainable vanilla item plus firearms/vehicles/permits, law enforcement/courts/jail/permits/land claims (Municipal), custom firearms (Arsenal), drivable vehicles (Motors), and playtime-gated age/job/wages/legacy resets (Careers). Ledger is built in and registers itself as the server's Vault economy provider - no other economy plugin required. Vault itself must still be installed. AIChat and DynamicShop are deprecated and are not part of this plugin.
authors: [donututils]
depend:
  - Vault
commands:
  # --- Ledger (banking/credit/loans/corporations) ---
  bank:
    description: Manage your bank account - deposit, withdraw, check balance and credit score.
    usage: /bank [deposit|withdraw|balance|credit] ...
    permission: ledger.command.bank
    permission-message: "&cYou do not have permission to use /bank."
  loan:
    description: Take out or repay a loan.
    usage: /loan [request|repay|status] ...
    permission: ledger.command.loan
    permission-message: "&cYou do not have permission to use /loan."
  corp:
    description: Found and manage a corporation.
    usage: /corp [found|report|info|dividend|trust] ...
    permission: ledger.command.corp
    permission-message: "&cYou do not have permission to use /corp."
  stock:
    description: Buy or sell shares of a corporation.
    usage: /stock [buy|sell|list|portfolio] ...
    permission: ledger.command.stock
    permission-message: "&cYou do not have permission to use /stock."
  ledgeradmin:
    description: Administer the Ledger economy.
    usage: /ledgeradmin <reload|forgiveloan> ...
    permission: ledger.admin
    permission-message: "&cYou do not have permission to manage Ledger."
  # --- StockMarket ---
  stocks:
    description: Open the stock market, or buy/sell/check a price from chat.
    usage: /stocks [price|buy|sell] ...
    permission: stockmarket.command.stocks
    permission-message: "&cYou do not have permission to use /stocks."
  portfolio:
    description: View your stock portfolio.
    usage: /portfolio
    permission: stockmarket.command.portfolio
    permission-message: "&cYou do not have permission to use /portfolio."
  stockleaderboard:
    description: Shows the richest stock market portfolios on the server.
    usage: /stockleaderboard
    permission: stockmarket.command.stockleaderboard
    permission-message: "&cYou do not have permission to use /stockleaderboard."
  stockadmin:
    description: Manage the stock market (create/delist/split/halt/resume/event/material/reload/save).
    usage: /stockadmin <create|delist|split|halt|resume|event|material|reload|save> ...
    permission: stockmarket.admin
    permission-message: "&cYou do not have permission to manage the stock market."
  # --- Market (dual-currency categorized shop) ---
  shop:
    description: Open the categorized item shop (Overworld/Nether/End/Firearms/Motors/Permits), or sell from chat.
    usage: /shop [sell hand|sellall]
    permission: market.command.shop
    permission-message: "&cYou do not have permission to use /shop."
  shopadmin:
    description: Administer the shop and Shards currency.
    usage: /shopadmin <reload|addshards <player> <amount>|setmultiplier <category> <value>> ...
    permission: market.admin
    permission-message: "&cYou do not have permission to manage the shop."
  shards:
    description: Check your Shards balance, or another player's.
    usage: /shards [player]
    permission: market.command.shards
    permission-message: "&cYou do not have permission to use /shards."
  # --- Municipal ---
  permit:
    description: Buy or check business/building/weapon permits.
    usage: /permit [buy <business|building|weapon>|check [player]]
    permission: municipal.command.permit
    permission-message: "&cYou do not have permission to use /permit."
  police:
    description: Arrest a player, opening a pending court case.
    usage: /police arrest <player> <reason>
    permission: municipal.police
    permission-message: "&cYou do not have permission to use /police."
  court:
    description: Preside over trials - sentence, dismiss, release, or check a criminal record.
    usage: /court [sentence <caseId> <minutes> <reason>|dismiss <caseId> [reason]|release <player>|record <player>]
    permission: municipal.judge
    permission-message: "&cYou do not have permission to use /court."
  municipal:
    description: Claim or unclaim the chunk you're standing in, view nearby claims, or reload config.
    usage: /municipal [claim|unclaim|map|reload]
    permission: municipal.command.claim
    permission-message: "&cYou do not have permission to use /municipal."
  location:
    description: Define named point warps or cuboid regions (jail, courthouse, market, etc) and teleport to them.
    usage: /location [pos1|pos2|save <name>|remove <name>|list|info <name>|tp <name>]
    permission: municipal.command.location
    permission-message: "&cYou do not have permission to use /location."
  # --- Arsenal ---
  arsenal:
    description: Give weapons/ammo, list configured weapons, or reload config.
    usage: /arsenal [give <player> <weapon>|giveammo <player> <weapon> [amount]|list|reload]
    permission: arsenal.admin
    permission-message: "&cYou do not have permission to use /arsenal."
  # --- Motors ---
  motors:
    description: Give vehicle spawners, check fuel/wear, refuel, repair, or list vehicles.
    usage: /motors [give <player> <vehicle>|list|info|refuel <amount>|repair|reload]
    permission: motors.use
    permission-message: "&cYou do not have permission to use /motors."
  # --- Careers ---
  career:
    description: Check your age/job, list jobs, reopen the choice menu, or reset your life as a legacy.
    usage: /career [info|list|choose <job>|reopen|legacy|reload]
    permission: careers.command.career
    permission-message: "&cYou do not have permission to use /career."
permissions:
  ledger.command.bank:
    description: Allows using the bank
    default: true
  ledger.command.loan:
    description: Allows requesting and repaying loans
    default: true
  ledger.command.corp:
    description: Allows founding and managing a corporation
    default: true
  ledger.command.stock:
    description: Allows trading corporation shares
    default: true
  ledger.admin:
    description: Allows administering Ledger's economy
    default: op
  stockmarket.command.stocks:
    description: Allows viewing and trading on the stock market
    default: true
  stockmarket.command.portfolio:
    description: Allows viewing your own portfolio
    default: true
  stockmarket.command.stockleaderboard:
    description: Allows viewing the stock market leaderboard
    default: true
  stockmarket.admin:
    description: Allows managing stocks (create, delist, split, halt, events)
    default: op
  market.command.shop:
    description: Allows using the categorized item shop
    default: true
  market.command.shards:
    description: Allows checking Shards balances
    default: true
  market.admin:
    description: Allows administering the shop and granting Shards
    default: op
  municipal.command.permit:
    description: Allows buying and checking permits
    default: true
  municipal.command.claim:
    description: Allows claiming/unclaiming land and viewing the claim map
    default: true
  municipal.command.location:
    description: Allows teleporting to and listing saved locations
    default: true
  municipal.location.admin:
    description: Allows defining, saving, and removing named locations
    default: op
  municipal.police:
    description: Allows arresting players
    default: op
  municipal.judge:
    description: Allows sentencing, dismissing, and releasing court cases
    default: op
  municipal.bypass:
    description: Skips building/weapon permit enforcement and land-claim protection
    default: op
  municipal.admin:
    description: Allows reloading Municipal's config
    default: op
  arsenal.admin:
    description: Allows giving weapons/ammo and reloading Arsenal's config
    default: op
  motors.use:
    description: Allows /motors info, refuel, and repair
    default: true
  motors.admin:
    description: Allows /motors give, list, and reload
    default: op
  careers.command.career:
    description: Allows checking and choosing a career
    default: true
  careers.admin:
    description: Allows reloading Careers' config
    default: op
