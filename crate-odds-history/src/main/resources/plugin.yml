name: CrateOddsHistory
version: ${project.version}
main: com.donututils.crateodds.CrateOddsHistoryPlugin
api-version: "1.21"
folia-supported: false
description: Shows crate drop odds and a player's recent crate-opening history, built on top of UltimateDonutSmp's crate data and CrateBindAddon's bind points.
authors: [donututils]
depend:
  - UltimateDonutSmp
softdepend:
  - CrateBindAddon
commands:
  crateodds:
    description: View the drop odds for a crate.
    usage: /crateodds <crate>
    permission: crateoddshistory.odds
    permission-message: "&cYou do not have permission to view crate odds."
  cratehistory:
    description: View a player's recent crate openings.
    usage: /cratehistory [player]
    permission: crateoddshistory.history
    permission-message: "&cYou do not have permission to view crate history."
permissions:
  crateoddshistory.odds:
    description: Allows viewing crate odds
    default: true
  crateoddshistory.history:
    description: Allows viewing your own crate history
    default: true
  crateoddshistory.history.others:
    description: Allows viewing other players' crate history
    default: op
