# Starter stocks so the market isn't empty on first run. Feel free to edit these directly (the
# plugin only reads this file on startup) or manage stocks in-game with /stockadmin.
# drift/volatility are fractions per tick - drift is the average trend, volatility is the typical
# random swing size. Small numbers: 0.0002 drift ~= a slow long-term climb, 0.01 volatility ~= a
# typical +-1% wobble per tick.
